name: webview_cef
description: Qesto-hardened Flutter Desktop WebView backed by CEF.
version: 0.6.2-qesto.1
homepage: https://github.com/hlwhl/webview_cef
repository: https://github.com/hlwhl/webview_cef

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: WebviewCefPlugin
      windows:
        pluginClass: WebviewCefPluginCApi
      linux:
        pluginClass: WebviewCefPlugin
      elinux:
        pluginClass: WebviewCefPlugin
